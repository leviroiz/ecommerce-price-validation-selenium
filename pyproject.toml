[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-price-validation-selenium"
version = "0.2.0"
description = "Sanitized regular-price and XG checking, stock intersection and selective Selenium correction"
requires-python = ">=3.11"
dependencies = ["selenium==4.47.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
price-demo = "price_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real Chrome against the local HTML fixture"]
