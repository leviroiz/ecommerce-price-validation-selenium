<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<title>Catálogo sintético — demonstração local</title>
<style>
body {font: 16px system-ui; max-width: 960px; margin: 40px auto; color: #162b38; background: #f3f7f9}
article {background: white; padding: 18px; margin: 16px 0; border: 1px solid #cbd9df; border-radius: 10px}
h1 {font-size: 28px} input, button {font: inherit; padding: 6px} .grid {font: 13px monospace; overflow-wrap: anywhere}
button {background: #006e65; color: white; border: 0; border-radius: 4px}
</style>
<h1>Validação de preços · catálogo sintético</h1>
<p>Fixture local. Nenhum produto, seletor ou integração de produção. DE/POR em BRL.</p>
<main id="catalog"></main>
<script>
const grid = [{color: 'azul-demo', size: 'M', stock: 4}, {color: 'azul-demo', size: 'XG', stock: 2}];
const initial = [
  {key:'SYN-001-retail', channel:'retail', before:'120.00', sale:'110.00', source:'synthetic_api_drift', variants:grid},
  {key:'SYN-001-wholesale', channel:'wholesale', before:'90.00', sale:'85.00', source:'synthetic_api_drift', variants:grid},
  {key:'SYN-002-retail', channel:'retail', before:'120.00', sale:'100.01', source:'synthetic_api_drift', variants:grid},
  {key:'SYN-003-retail', channel:'retail', before:'120.00', sale:'110.00', source:'synthetic_api_drift', variants:grid.map(v=>({...v,stock:0}))},
  {key:'SYN-004-wholesale', channel:'wholesale', before:'90.00', sale:'85.00', source:'synthetic_api_drift', variants:[grid[0]]},
  {key:'SYN-005-retail', channel:'retail', before:'120.00', sale:'110.00', source:'unknown', variants:grid}
];
const storageKey = 'synthetic-price-demo-v1';
const offers = JSON.parse(sessionStorage.getItem(storageKey) || 'null') || initial;
for (const offer of offers) {
  const article = document.createElement('article');
  article.dataset.key = offer.key;
  article.dataset.channel = offer.channel;
  article.dataset.source = offer.source;
  article.innerHTML = `<h2></h2><p>DE <span class="before"></span> → POR <span class="saved-sale"></span></p>
    <p class="grid"></p><label>Novo POR <input inputmode="decimal" aria-label="Novo preço POR"></label>
    <button type="button">Salvar no mock</button><output aria-live="polite"></output>`;
  article.querySelector('h2').textContent = offer.key;
  article.querySelector('.before').textContent = offer.before;
  article.querySelector('.saved-sale').textContent = offer.sale;
  article.querySelector('.grid').textContent = JSON.stringify(offer.variants);
  article.querySelector('input').value = offer.sale;
  article.querySelector('button').addEventListener('click', () => {
    const value = article.querySelector('input').value;
    if (!/^\d{1,7}\.\d{2}$/.test(value) || Number(value) <= 0 || Number(value) > Number(offer.before)) {
      article.querySelector('output').textContent = 'Preço inválido'; return;
    }
    offer.sale = value;
    sessionStorage.setItem(storageKey, JSON.stringify(offers));
    article.querySelector('.saved-sale').textContent = value;
    article.querySelector('output').textContent = 'Salvo localmente';
  });
  document.querySelector('#catalog').append(article);
}
</script>
</html>
